server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No basic auth here, unlike the blog vhost: MCP clients authenticate with
    # the Bearer token or OAuth, and an extra HTTP challenge would break both.

    # Memory content is capped at 1MB by the service; the rest covers the
    # JSON-RPC envelope.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # save/search fork a child that loads a ~470MB ONNX model before it can
        # answer, so the first call after an idle period is slow.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
